<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Payment Details</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .navbar, footer {
            background-color: #222;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .nav-link {
            color: #ddd !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .payment-container {
            max-width: 750px;
            margin: 40px auto;
        }

        .payment-card {
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .payment-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .bill-summary {
            background-color: #f5f5f5;
            padding: 20px;
            border: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .total-amount {
            color: #198754;
            font-size: 25px;
            font-weight: bold;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control, .form-select {
            padding: 10px;
            border-radius: 4px;
        }

        .btn-dark {
            background-color: #222;
            border-color: #222;
        }

        .payment-btn {
            width: 100%;
            margin-top: 15px;
        }

        footer {
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" th:href="@{/customer-details/home}">
            FLOWER SHOP MANAGEMENT
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               th:href="@{/customer-details/home}">
                Home
            </a>

            <a class="nav-link"
               th:href="@{/sales-Details/add}">
                New Sale
            </a>

        </div>

    </div>
</nav>


<!-- PAYMENT PAGE -->

<div class="container payment-container">

    <div class="payment-card">

        <div class="payment-title">

            <h2>Payment Details</h2>

            <p class="text-secondary">
                Complete your sales payment
            </p>

            <hr>

        </div>


        <!-- BILL SUMMARY -->

        <div class="bill-summary">

            <h5 class="mb-3">Bill Summary</h5>

            <div class="row mb-3">

                <div class="col-6">
                    <strong>Bill Number</strong>
                </div>

                <div class="col-6 text-end">
                    <span th:text="${salesDetails.billNo}"></span>
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-6">
                    <strong>Sale Date</strong>
                </div>

                <div class="col-6 text-end">
                    <span th:text="${salesDetails.saleDate}"></span>
                </div>

            </div>


            <hr>


            <div class="row align-items-center">

                <div class="col-6">
                    <strong>Grand Total</strong>
                </div>

                <div class="col-6 text-end">

                    <span class="total-amount">
                        ₹ <span th:text="${salesDetails.saleTotalAmount}"></span>
                    </span>

                </div>

            </div>

        </div>


        <!-- PAYMENT FORM -->

        <form th:action="@{/payments/save}"
              th:object="${paymentDetails}"
              method="post">


            <!-- SALE ID -->

            <input type="hidden"
                   name="saleId"
                   th:value="${salesDetails.saleId}">


            <!-- PAYMENT DATE -->

            <div class="mb-3">

                <label class="form-label">
                    Payment Date
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{paymentDate}"
                       id="paymentDate"
                       required>

            </div>


            <!-- PAYMENT MODE -->

            <div class="mb-3">

                <label class="form-label">
                    Payment Mode
                </label>

                <select class="form-select"
                        th:field="*{payementMode}"
                        required>

                    <option value="">
                        Select Payment Mode
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Card">
                        Card
                    </option>

                    <option value="PhoneScan">
                        PhoneScan (UPI)
                    </option>

                </select>

            </div>


            <!-- PAYMENT AMOUNT -->

            <div class="mb-3">

                <label class="form-label">
                    Payment Amount
                </label>

                <input type="text"
                       class="form-control"
                       th:value="${salesDetails.saleTotalAmount}"
                       readonly>

                <small class="text-secondary">
                    Amount is automatically taken from the sales bill.
                </small>

            </div>


            <!-- BUTTONS -->
			<p th:if="${error}" th:text="${error}"class="text-danger fw-bold text-center"></p>
            <button type="submit"
                    class="btn btn-dark payment-btn">
                Complete Payment
            </button>

            <a th:href="@{/sales-Details/add}"
               class="btn btn-outline-dark payment-btn">
                Cancel
            </a>

        </form>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p class="mb-0">
        FLOWER SHOP MANAGEMENT | Sales Management System
    </p>

</footer>


<!-- DEFAULT PAYMENT DATE -->

<script>
    document.addEventListener("DOMContentLoaded", function() {

        const today = new Date();

        const formattedDate =
            today.getFullYear() + "-" +
            String(today.getMonth() + 1).padStart(2, '0') + "-" +
            String(today.getDate()).padStart(2, '0');

        document.getElementById("paymentDate").value = formattedDate;

    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
