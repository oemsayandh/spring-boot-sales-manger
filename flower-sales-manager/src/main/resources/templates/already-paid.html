<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Payment Already Completed</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .message-card {
            background: white;
            border: 1px solid #ddd;
            padding: 40px;
            max-width: 550px;
            margin: 100px auto;
            text-align: center;
        }

        .success-icon {
            font-size: 50px;
            color: #198754;
        }

        .navbar, footer {
            background-color: #222;
            color: white;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/customer-details/home}">
            FLOWER SHOP MANAGEMENT
        </a>

    </div>
</nav>


<div class="container">

    <div class="message-card">

        <div class="success-icon">✓</div>

        <h3 class="mt-3">Payment Already Completed</h3>

        <p class="text-secondary mt-3">
            This sales bill has already been paid.
            Duplicate payments are not allowed.
        </p>

        <a th:href="@{/sales-Details/add}"
           class="btn btn-dark mt-3">
            Go to New Sale
        </a>

    </div>

</div>


<footer>
    FLOWER SHOP MANAGEMENT | Sales Management System
</footer>

</body>
</html>
