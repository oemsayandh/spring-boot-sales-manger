<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Flower Stock</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVIGATION -->

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/flower-stock-details/home}">
            FLOWER SALES MANAGER
        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-stock-details/home}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-details/add}">
                        Flowers
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-stock-details/list}">
                        Stock
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/sales/add}">
                        Sales
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/sales-log/list}">
                        Sales Log
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- PAGE CONTENT -->

<div class="container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>Edit Flower Stock Details</h2>

        <p class="text-secondary mb-0 mt-2">
            Update flower name, stock date, quantity and price details.
        </p>

    </div>


    <!-- EDIT STOCK FORM -->

    <div class="form-card">

        <div class="card-body">

            <h4 class="mb-4">Stock Information</h4>

            <hr>

            <form th:action="@{/flower-stock-details/update}"
                  th:object="${flowerStockDetails}"
                  method="post">

                <input type="hidden" th:field="*{stockId}">


                <!-- FLOWER NAME -->

                <div class="mb-4">

                    <label class="form-label">
                        Flower Name
                    </label>

                    <select class="form-select"
                            th:field="*{flowers.flowerId}"
                            required>

                        <option value="">
                            -- Select Flower --
                        </option>

                        <option th:each="flower : ${flowers}"
                                th:value="${flower.flowerId}"
                                th:text="${flower.flowerName}">
                        </option>

                    </select>

                </div>


                <!-- STOCK DATE -->

                <div class="mb-4">

                    <label class="form-label">
                        Stock Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{stockDate}"
                           required>

                </div>


                <!-- STOCK QUANTITY -->

                <div class="mb-4">

                    <label class="form-label">
                        Stock (KG)
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{stock}"
                           step="0.01"
                           min="0"
                           required>

                </div>


                <!-- PRICE -->

                <div class="mb-4">

                    <label class="form-label">
                        Price Per KG (₹)
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{price}"
                           step="0.01"
                           min="0"
                           required>

                </div>


                <hr class="mb-4">


                <!-- BUTTONS -->

                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit"
                            class="btn btn-dark">
                        Update Stock
                    </button>

                    <a th:href="@{/flower-stock-details/list}"
                       class="btn btn-outline-dark">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p class="mb-0">
        FLOWER SALES MANAGER | Flower Management System
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
