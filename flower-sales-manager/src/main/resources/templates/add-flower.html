<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Flower</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #222;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .nav-link {
            color: #ddd !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .page-header {
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            margin-top: 35px;
        }

        .form-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 30px;
        }

        .form-card .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 4px;
            padding: 10px;
        }

        .form-control:focus {
            border-color: #555;
            box-shadow: 0 0 0 0.15rem rgba(34, 34, 34, 0.15);
        }

        .btn-dark {
            background-color: #222;
            border-color: #222;
        }

        .btn-dark:hover {
            background-color: #444;
            border-color: #444;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<!-- NAVIGATION -->

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/flower-stock-details/home}">
            FLOWER SALES MANAGER
        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-stock-details/home}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-details/add}">
                        Flowers
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/flower-stock-details/list}">
                        Stock
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/sales/add}">
                        Sales
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/sales-log/list}">
                        Sales Log
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- PAGE CONTENT -->

<div class="container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>Add Flower Details</h2>

        <p class="text-secondary mb-0 mt-2">
            Register new flowers in the Flower Management System.
        </p>

    </div>


    <!-- ADD FLOWER FORM -->

    <div class="form-card">

        <div class="card-body">

            <h4 class="mb-4">Flower Information</h4>

            <hr>

            <form th:action="@{/flower-details/save}"
                  th:object="${flowers}"
                  method="post">

                <div class="mb-4">

                    <label class="form-label">
                        Flower Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{flowerName}"
                           placeholder="Enter flower name"
                           required>

                </div>

                <hr class="mb-4">

                <!-- BUTTONS -->

                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit"
                            class="btn btn-dark">
                        Save Flower
                    </button>

                    <a th:href="@{/flower-details/list}"
                       class="btn btn-outline-dark">
                        View All Flowers
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- QUICK NAVIGATION -->

    <div class="mt-4 mb-5">

        <a th:href="@{/flower-stock-details/list}"
           class="btn btn-dark me-2">
            Stock Update
        </a>

        <a th:href="@{/flower-stock-details/home}"
           class="btn btn-outline-dark">
            Back to Home
        </a>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p class="mb-0">
        FLOWER SALES MANAGER | Flower Management System
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
